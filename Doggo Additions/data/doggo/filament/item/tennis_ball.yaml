id: doggo:tennis_ball
vanillaItem: minecraft:slime_ball
itemResource:
  models:
    default: "minecraft:item/tennis_ball"
translations:
  en_us: Tennis Ball
behaviour:
  snowball:
    hitCommands:
      - summon item ~ ~ ~ {Item:{id:"doggo:tennis_ball",count:1},Motion:[0.0,0.5,0.0]}
      - playsound minecraft:block.anvil.break neutral @a ~ ~ ~ 1 1
    executeAtHit: true
    
components:
  minecraft:equippable:
    slot: head
    swappable: false
    equip_on_interact: false
    dispensable: false